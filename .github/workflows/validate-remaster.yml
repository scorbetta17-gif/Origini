name: ORIGINI - test rimasterizzazione (senza release)
on:
  push:
    branches: [work/remaster-068]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Installa Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Controlli statici
        run: python3 tests/qa_static.py
      - name: Import e parsing del progetto
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee godot-import.log
          if grep -E '(SCRIPT ERROR|Parse Error|Failed to load script)' godot-import.log; then
            exit 1
          fi
      - name: Smoke test
        run: timeout 90s godot --headless --path . --script res://tests/smoke.gd
      - name: Driver per capture 3D
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri
      - name: Screenshot autentici (Godot con display virtuale)
        run: |
          mkdir -p build/previews
          timeout 90s xvfb-run -a godot --path . --rendering-method gl_compatibility --script res://tests/capture_preview.gd
          test -s build/previews/primordiale-godot.png
          test -s build/previews/cellula-evoluta-godot.png
          test -s build/previews/bioma-idrotermale-godot.png
      - name: Salva screenshot 3D per la revisione
        uses: actions/upload-artifact@v4
        with:
          name: ORIGINI-Remaster-Screenshot-Reali
          path: build/previews/*.png
          if-no-files-found: error

  android-preview:
    if: github.event_name != 'pull_request'
    needs: qa
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Installa Godot e modelli di esportazione
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Importa il progetto
        run: godot --headless --path . --editor --quit
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android API 35
        run: sdkmanager --install 'platform-tools' 'build-tools;35.0.1' 'platforms;android-35'
      - name: Firma debug locale alla CI
        shell: bash
        run: |
          mkdir -p ~/.config/godot build/android
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF
          keytool -genkeypair -v -keystore "${RUNNER_TEMP}/origini-remaster-debug.keystore" \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=ORIGINI Preview,O=Test,C=IT" -noprompt
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=${RUNNER_TEMP}/origini-remaster-debug.keystore" >> "${GITHUB_ENV}"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "${GITHUB_ENV}"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "${GITHUB_ENV}"
      - name: Esporta APK Android ARM64
        run: godot --headless --path . --export-debug Android build/android/ORIGINI-REMMASTER-PREVIEW.apk
      - name: Verifica archivio APK
        run: |
          test -s build/android/ORIGINI-REMMASTER-PREVIEW.apk
          unzip -t build/android/ORIGINI-REMMASTER-PREVIEW.apk >/dev/null
          unzip -Z1 build/android/ORIGINI-REMMASTER-PREVIEW.apk | grep -q '^AndroidManifest.xml$'
      - name: APK Android solo come artefatto (no release)
        uses: actions/upload-artifact@v4
        with:
          name: ORIGINI-Remaster-Android-Preview
          path: build/android/ORIGINI-REMMASTER-PREVIEW.apk
          if-no-files-found: error
