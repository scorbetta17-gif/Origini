name: ORIGINI - test rimasterizzazione (senza release)
on:
  push:
    branches: [work/remaster-068]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Installa Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Verifica asset Blender GLB versionati
        run: python3 tools/blender/validate_cell_assets.py
      - name: Controlli statici
        run: python3 tests/qa_static.py
      - name: Import e parsing del progetto
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee godot-import.log
          if grep -E '(SCRIPT ERROR|Parse Error|Failed to load script)' godot-import.log; then
            exit 1
          fi
      - name: Smoke test
        run: timeout 90s godot --headless --path . --script res://tests/smoke.gd
      - name: Genotipo, ereditarieta' e fenotipo
        run: timeout 90s godot --headless --path . --script res://tests/genome_smoke.gd
      - name: Fase 2 completa - da riconoscimento a trasmissione
        run: timeout 120s godot --headless --path . --script res://tests/phase_two_smoke.gd
      - name: Import effettivo Blender 3D e moduli per gene
        run: timeout 90s godot --headless --path . --script res://tests/blender_asset_smoke.gd
      - name: Driver per capture 3D
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-vulkan-drivers vulkan-tools
      - name: Screenshot autentici (Godot con display virtuale)
        run: |
          mkdir -p build/previews
          timeout 90s xvfb-run -a godot --path . --rendering-method gl_compatibility --script res://tests/capture_preview.gd
          test -s build/previews/primordiale-godot.png
          test -s build/previews/primordiale-macro-godot.png
          test -s build/previews/fenotipo-macro-godot.png
          test -s build/previews/cellula-evoluta-godot.png
          test -s build/previews/bioma-idrotermale-godot.png
      - name: Screenshot reali tramite renderer Mobile/Vulkan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/previews
          export ORIGIN_REQUIRE_MOBILE=1
          export ORIGIN_CAPTURE_PREFIX="mobile-"
          if test -f /usr/share/vulkan/icd.d/lvp_icd.x86_64.json; then
            export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          fi
          timeout 180s xvfb-run -a godot --path . --rendering-method mobile --rendering-driver vulkan --script res://tests/capture_preview.gd 2>&1 | tee build/mobile-vulkan.log
          grep -q 'ORIGIN_ACTUAL_RENDERER=mobile DRIVER=vulkan' build/mobile-vulkan.log
          test -s build/previews/mobile-primordiale-macro-godot.png
          test -s build/previews/mobile-fenotipo-macro-godot.png
      - name: Salva screenshot 3D per la revisione
        uses: actions/upload-artifact@v4
        with:
          name: ORIGINI-Remaster-Screenshot-Reali
          path: build/previews/*.png
          if-no-files-found: error

  android-preview:
    needs: qa
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: App di test separata per non sovrascrivere demo-6
        run: |
          sed -i 's@package/unique_name="org.origini.mobile"@package/unique_name="org.origini.mobile.preview.vulkan"@' export_presets.cfg
          sed -i 's@package/name="ORIGINI"@package/name="ORIGINI VULKAN"@' export_presets.cfg
          sed -i 's@version/name="0.67-demo"@version/name="0.69-vulkan-preview"@' export_presets.cfg
          sed -i 's@version/code=67@version/code=69@' export_presets.cfg
          grep -q 'org.origini.mobile.preview.vulkan' export_presets.cfg
      - name: Installa Godot e modelli di esportazione
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Importa il progetto
        run: godot --headless --path . --editor --quit
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android API 35
        run: sdkmanager --install 'platform-tools' 'build-tools;35.0.1' 'platforms;android-35'
      - name: Firma debug locale alla CI
        shell: bash
        run: |
          mkdir -p ~/.config/godot build/android
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF
          keytool -genkeypair -v -keystore "${RUNNER_TEMP}/origini-remaster-debug.keystore" \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=ORIGINI Preview,O=Test,C=IT" -noprompt
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=${RUNNER_TEMP}/origini-remaster-debug.keystore" >> "${GITHUB_ENV}"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "${GITHUB_ENV}"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "${GITHUB_ENV}"
      - name: Esporta APK Android Mobile/Vulkan
        run: godot --headless --path . --export-debug Android build/android/ORIGINI-VULKAN-PREVIEW.apk
      - name: Verifica Vulkan APK
        run: |
          test -s build/android/ORIGINI-VULKAN-PREVIEW.apk
          unzip -t build/android/ORIGINI-VULKAN-PREVIEW.apk >/dev/null
          unzip -Z1 build/android/ORIGINI-VULKAN-PREVIEW.apk | grep -q '^AndroidManifest.xml$'
          "${ANDROID_HOME}/build-tools/35.0.1/aapt" dump badging build/android/ORIGINI-VULKAN-PREVIEW.apk | grep -q "org.origini.mobile.preview.vulkan"
      - name: Crea variante OpenGL Compatibility per telefoni non Vulkan
        run: |
          sed -i 's@renderer/rendering_method="mobile"@renderer/rendering_method="gl_compatibility"@' project.godot
          sed -i 's@renderer/rendering_method.mobile="mobile"@renderer/rendering_method.mobile="gl_compatibility"@' project.godot
          sed -i 's@org.origini.mobile.preview.vulkan@org.origini.mobile.preview.compat@' export_presets.cfg
          sed -i 's@ORIGINI VULKAN@ORIGINI COMPAT@' export_presets.cfg
          sed -i 's@0.69-vulkan-preview@0.69-compat-preview@' export_presets.cfg
          godot --headless --path . --editor --quit
      - name: Esporta APK Android Compatibility
        run: godot --headless --path . --export-debug Android build/android/ORIGINI-COMPAT-PREVIEW.apk
      - name: Verifica Compatibility APK
        run: |
          test -s build/android/ORIGINI-COMPAT-PREVIEW.apk
          unzip -t build/android/ORIGINI-COMPAT-PREVIEW.apk >/dev/null
          unzip -Z1 build/android/ORIGINI-COMPAT-PREVIEW.apk | grep -q '^AndroidManifest.xml$'
          "${ANDROID_HOME}/build-tools/35.0.1/aapt" dump badging build/android/ORIGINI-COMPAT-PREVIEW.apk | grep -q "org.origini.mobile.preview.compat"
      - name: APK Android Mobile/Vulkan solo come artefatto (no release)
        uses: actions/upload-artifact@v4
        with:
          name: ORIGIN-Android-Mobile-Vulkan
          path: build/android/ORIGINI-VULKAN-PREVIEW.apk
          if-no-files-found: error
      - name: APK Android Compatibility solo come artefatto (no release)
        uses: actions/upload-artifact@v4
        with:
          name: ORIGIN-Android-Compatibility
          path: build/android/ORIGINI-COMPAT-PREVIEW.apk
          if-no-files-found: error
