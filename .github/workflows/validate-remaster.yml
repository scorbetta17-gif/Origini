name: ORIGINI - campagna unificata e rendering
on:
  push:
    branches: [work/unified-evolution]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unified-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Asset e contratti statici
        run: |
          python3 tools/blender/validate_cell_assets.py
          python3 tests/qa_static.py
      - name: Import
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' import.log; then exit 1; fi
      - name: Suite isolata con controlli errori e timeout
        run: python3 tests/run_suite.py --godot godot --timeout 180
      - name: Driver di rendering
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-vulkan-drivers
      - name: Campagna e fenotipi OpenGL
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s xvfb-run -a -s "-screen 0 1000x1600x24" godot --path . --rendering-method gl_compatibility --script res://tests/capture_unified.gd 2>&1 | tee capture-gl.log
          grep -q 'RENDERER=gl_compatibility' capture-gl.log
          if grep -E 'SCRIPT ERROR|Shader compilation failed' capture-gl.log; then exit 1; fi
          test -s build/previews/unified-capabilities.png
          test -s build/previews/unified-fission.png
          test -s build/previews/unified-eukaryote.png
      - name: Campagna e fenotipi Mobile Vulkan
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN_CAPTURE_PREFIX=mobile- timeout 180s xvfb-run -a -s "-screen 0 1000x1600x24" godot --path . --rendering-method mobile --rendering-driver vulkan --script res://tests/capture_unified.gd 2>&1 | tee capture-vulkan.log
          grep -q 'RENDERER=mobile DRIVER=vulkan' capture-vulkan.log
          if grep -E 'SCRIPT ERROR|Shader compilation failed' capture-vulkan.log; then exit 1; fi
          test -s build/previews/mobile-unified-eukaryote.png
      - name: Fondale e faglie
        run: timeout 180s xvfb-run -a godot --path . --rendering-method gl_compatibility --script res://tests/capture_seabed.gd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ORIGINI-Unified-QA
          path: |
            build/previews/*.png
            *.log
            ../.tools/test_runs/**/summary.json
            ../.tools/test_runs/**/output.log
