name: ORIGIN - Bake original Blender cell library
on:
  push:
    branches: [work/remaster-068]
    paths:
      - "tools/blender/**"
      - ".github/workflows/bake-cell-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  blender:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Installa Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender
          blender --version
      - name: Genera modelli 3D originali da geometria Blender
        run: blender --background --factory-startup --python tools/blender/create_cell_assets.py
      - name: Verifica struttura e integrita' GLB
        run: python3 tools/blender/validate_cell_assets.py
      - name: Versiona gli asset binari su ramo di lavoro
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/*.glb
          if ! git diff --cached --quiet; then
            git commit -m "Bake Blender primordial cell core and gene-linked modules"
            git push origin HEAD:work/remaster-068
          fi
