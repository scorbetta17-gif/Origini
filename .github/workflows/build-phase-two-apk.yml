name: ORIGINI - APK campagna unificata scaricabile
on:
  push:
    branches: [work/living-niches-084]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apk-phase2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Asset e controlli statici
        run: |
          python3 tools/blender/validate_cell_assets.py
          python3 tests/qa_static.py
      - name: Import e suite Godot
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' import.log; then exit 1; fi
          for test in tests/*smoke.gd; do
            timeout 180s godot --headless --path . --script "res://$test" 2>&1 | tee test.log
            grep -q 'PASS' test.log
            if grep -E 'SCRIPT ERROR|Parse Error|Assertion failed' test.log; then exit 1; fi
          done
  android-preview:
    permissions:
      contents: write
    needs: qa
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Versione 0.84 Android Compatibility con pacchetto nuovo
        run: |
          set -euo pipefail
          sed -i 's@renderer/rendering_method="mobile"@renderer/rendering_method="gl_compatibility"@' project.godot
          sed -i 's@renderer/rendering_method.mobile="mobile"@renderer/rendering_method.mobile="gl_compatibility"@' project.godot
          sed -i 's@package/unique_name="org.origini.mobile"@package/unique_name="org.origini.mobile.unified084"@' export_presets.cfg
          sed -i 's@package/name="ORIGINI"@package/name="ORIGINI 0.84"@' export_presets.cfg
          sed -i 's@version/name="0.67-demo"@version/name="0.84-evoluzione"@' export_presets.cfg
          sed -i 's@version/code=67@version/code=84@' export_presets.cfg
          grep -q 'org.origini.mobile.unified084' export_presets.cfg
      - name: Installa Godot 4.7.2 + export templates corrispondenti
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Importa progetto e verifica renderer Compatibility
        run: |
          godot --headless --path . --editor --quit
          grep -q 'renderer/rendering_method="gl_compatibility"' project.godot
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK e strumenti nativi
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: SDK + build tools per zipalign/apksigner
        run: sdkmanager --install 'platform-tools' 'build-tools;35.0.1' 'platforms;android-35'
      - name: Prepara firma debug pulita
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.config/godot build/android
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF
          keytool -genkeypair -keystore "${RUNNER_TEMP}/origini-native-fix.keystore" \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=ORIGINI 082 Preview,O=Game,C=IT" -noprompt
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=${RUNNER_TEMP}/origini-native-fix.keystore" >> "${GITHUB_ENV}"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "${GITHUB_ENV}"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "${GITHUB_ENV}"
      - name: Escludi test e strumenti dal pacchetto
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('export_presets.cfg')
          s=p.read_text().replace('exclude_filter=""','exclude_filter="tests/*,tools/*,docs/*,build/*,.github/*,*.md"',1)
          p.write_text(s)
          PY
      - name: Crea APK Android Compatibility
        run: godot --headless --path . --export-debug Android build/android/ORIGINI-base.apk
      - name: Ricompone librerie native Godot senza compressione
        run: |
          set -euo pipefail
          python3 tools/android/harden_apk_native.py build/android/ORIGINI-base.apk build/android/ORIGINI-native-unsigned.apk
      - name: Allinea librerie native a 16 KiB
        shell: bash
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/build-tools/35.0.1/zipalign" -P 16 -f -v 4 \
            build/android/ORIGINI-native-unsigned.apk build/android/ORIGINI-native-aligned.apk
      - name: Firma nuovamente APK con v1 v2 v3
        shell: bash
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/build-tools/35.0.1/apksigner" sign \
            --ks "${RUNNER_TEMP}/origini-native-fix.keystore" \
            --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out build/android/ORIGINI-0.84-EVOLUZIONE.apk \
            build/android/ORIGINI-native-aligned.apk
      - name: Verifica APK finale, caricamento ABI e firma
        shell: bash
        run: |
          set -euo pipefail
          apk=build/android/ORIGINI-0.84-EVOLUZIONE.apk
          test -s "${apk}"
          unzip -t "${apk}" >/dev/null
          "${ANDROID_HOME}/build-tools/35.0.1/zipalign" -c -P 16 -v 4 "${apk}"
          "${ANDROID_HOME}/build-tools/35.0.1/apksigner" verify --verbose --print-certs "${apk}"
          python3 tools/android/verify_apk_native.py "${apk}"
          "${ANDROID_HOME}/build-tools/35.0.1/aapt" dump badging "${apk}" | grep -q "org.origini.mobile.unified084"
          "${ANDROID_HOME}/build-tools/35.0.1/aapt" dump xmltree "${apk}" AndroidManifest.xml | grep -q 'extractNativeLibs'
      - name: APK installabile da smartphone
        uses: actions/upload-artifact@v4
        with:
          name: ORIGINI-084-EVOLUZIONE-APK
          path: build/android/ORIGINI-0.84-EVOLUZIONE.apk
          if-no-files-found: error
      - name: Pubblica APK di prova scaricabile direttamente
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=build/android/ORIGINI-0.84-EVOLUZIONE.apk
          tag="preview-unified-0.84-${GITHUB_SHA:0:8}"
          sha256sum "$apk" > build/android/SHA256SUMS.txt
          cat > build/android/NOTE.md <<EOF
          APK Android ARM64 di prova, renderer Compatibility/OpenGL.
          Sorgenti: ${GITHUB_SHA}. Battle Royale separato: fronti ambientali, depositi contesi, 12 avversari IA, alleanze, quattro specializzazioni e salvataggio dedicato.
          Pacchetto separato org.origini.mobile.unified084: si installa accanto alle vecchie demo.
          Firma debug; verificati firma, librerie ARM64 e allineamento 16 KiB. Non ancora provato su telefono fisico.
          PM, soglie demografiche e ordine delle acquisizioni sono astrazioni di gioco. Percorso accelerato testato; durata naturale completa e prestazioni fisiche Android da verificare.
          EOF
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release gia esistente: non sovrascrivo un APK firmato."
          else
            gh release create "$tag" "$apk" build/android/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "ORIGINI 0.84 - Campagna unificata (APK di prova)" --notes-file build/android/NOTE.md
          fi
